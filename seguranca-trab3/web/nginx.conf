# PROVISÓRIO (Membro A): só HTTP na porta 80, para o Módulo 1 funcionar.
# O Membro B acrescenta 443 (TLS), 8080, redirecionamento HTTPS e HSTS.
worker_processes 1;
error_log stderr warn;
user www-data;
pid /run/nginx.pid;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    server_tokens on;   # deixa a versão no cabeçalho "Server" (vazamento visto no M1)

    upstream aplicacao { server app:8000; }

    server {
        listen 80;
        server_name web.lab;

        location / {
            proxy_pass http://aplicacao;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
